<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Strokes Gained analysis screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="barPos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ECF8E"/>
      <stop offset="100%" stop-color="#0C5E3F"/>
    </linearGradient>
    <linearGradient id="barNeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" rx="32" fill="url(#bg)"/>
  <rect x="0" y="0" width="360" height="640" rx="32" fill="none" stroke="rgba(12,94,63,0.12)" stroke-width="2"/>
  <!-- Header -->
  <rect x="0" y="0" width="360" height="88" rx="32" fill="#0C5E3F"/>
  <rect x="0" y="56" width="360" height="32" fill="#0C5E3F"/>
  <text x="32" y="52" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Strokes Gained</text>
  <text x="32" y="72" fill="rgba(255,255,255,0.75)" font-family="system-ui,sans-serif" font-size="12">Última ronda · Par 72</text>
  <!-- Summary -->
  <rect x="24" y="108" width="312" height="80" rx="16" fill="#e8f8f0"/>
  <text x="40" y="136" fill="#0C5E3F" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Tu mayor oportunidad</text>
  <text x="40" y="162" fill="#4b5560" font-family="system-ui,sans-serif" font-size="12">Approach: -1.4 vs jugadores HCP 18</text>
  <text x="300" y="152" fill="#0C5E3F" font-family="system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="end">-3.2</text>
  <!-- Chart -->
  <text x="32" y="220" fill="#0d0f12" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Por categoría</text>
  <!-- Bars -->
  <text x="32" y="252" fill="#4b5560" font-family="system-ui,sans-serif" font-size="11">Driving</text>
  <rect x="120" y="238" width="180" height="20" rx="10" fill="#f0f0f0"/>
  <rect x="120" y="238" width="108" height="20" rx="10" fill="url(#barPos)"/>
  <text x="312" y="252" fill="#0C5E3F" font-family="system-ui,sans-serif" font-size="11" font-weight="600">+0.4</text>
  <text x="32" y="288" fill="#4b5560" font-family="system-ui,sans-serif" font-size="11">Approach</text>
  <rect x="120" y="274" width="180" height="20" rx="10" fill="#f0f0f0"/>
  <rect x="120" y="274" width="144" height="20" rx="10" fill="url(#barNeg)"/>
  <text x="312" y="288" fill="#dc2626" font-family="system-ui,sans-serif" font-size="11" font-weight="600">-1.4</text>
  <text x="32" y="324" fill="#4b5560" font-family="system-ui,sans-serif" font-size="11">Around green</text>
  <rect x="120" y="310" width="180" height="20" rx="10" fill="#f0f0f0"/>
  <rect x="120" y="310" width="90" height="20" rx="10" fill="url(#barNeg)"/>
  <text x="312" y="324" fill="#dc2626" font-family="system-ui,sans-serif" font-size="11" font-weight="600">-0.8</text>
  <text x="32" y="360" fill="#4b5560" font-family="system-ui,sans-serif" font-size="11">Putting</text>
  <rect x="120" y="346" width="180" height="20" rx="10" fill="#f0f0f0"/>
  <rect x="120" y="346" width="72" height="20" rx="10" fill="url(#barPos)"/>
  <text x="312" y="360" fill="#0C5E3F" font-family="system-ui,sans-serif" font-size="11" font-weight="600">+0.2</text>
  <!-- Comparison card -->
  <rect x="24" y="396" width="312" height="120" rx="16" fill="#fff" stroke="rgba(12,94,63,0.12)"/>
  <text x="40" y="424" fill="#0d0f12" font-family="system-ui,sans-serif" font-size="13" font-weight="600">vs. jugadores HCP 18</text>
  <circle cx="56" cy="456" r="6" fill="#3ECF8E"/>
  <text x="72" y="460" fill="#4b5560" font-family="system-ui,sans-serif" font-size="11">Tú: 84 golpes</text>
  <circle cx="56" cy="484" r="6" fill="#8a939c"/>
  <text x="72" y="488" fill="#4b5560" font-family="system-ui,sans-serif" font-size="11">Media HCP 18: 87 golpes</text>
  <!-- Recommendation -->
  <rect x="24" y="536" width="312" height="72" rx="16" fill="#0C5E3F"/>
  <text x="40" y="564" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Recomendación IA</text>
  <text x="40" y="584" fill="rgba(255,255,255,0.85)" font-family="system-ui,sans-serif" font-size="11">3 sesiones de approach 130-160m</text>
</svg>
