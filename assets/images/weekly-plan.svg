  <rect x="24" y="220" width="312" height="88" rx="16" fill="#fff" stroke="rgba(12,94,63,0.1)"/>
  <rect x="40" y="236" width="48" height="48" rx="12" fill="#e8f8f0"/>
  <text x="64" y="266" fill="#0C5E3F" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">M</text>
  <text x="104" y="252" fill="#0d0f12" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Short game · Bunker</text>
  <text x="104" y="272" fill="#4b5560" font-family="system-ui,sans-serif" font-size="11">30 min · Practice green</text>
  <text x="104" y="290" fill="#8a939c" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Prioridad media</text>
  <rect x="24" y="320" width="312" height="88" rx="16" fill="#fff" stroke="rgba(12,94,63,0.1)"/>
  <rect x="40" y="336" width="48" height="48" rx="12" fill="#e8f8f0"/>
  <text x="64" y="366" fill="#0C5E3F" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">X</text>
  <text x="104" y="352" fill="#0d0f12" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Descanso activo</text>
  <text x="104" y="372" fill="#4b5560" font-family="system-ui,sans-serif" font-size="11">Estiramientos · 15 min</text>
  <rect x="24" y="420" width="312" height="88" rx="16" fill="#0C5E3F"/>
  <rect x="40" y="436" width="48" height="48" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="64" y="466" fill="#3ECF8E" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">J</text>
  <text x="104" y="452" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Ronda de práctica</text>
  <text x="104" y="472" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="11">9 hoyos · Enfócate en approach</text>
  <text x="104" y="490" fill="#3ECF8E" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Hoy</text>
