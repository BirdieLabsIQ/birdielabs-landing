  <text x="64" y="166" fill="#0C5E3F" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">L</text>
  <text x="104" y="152" fill="#0d0f12" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Approach 130-160m</text>
