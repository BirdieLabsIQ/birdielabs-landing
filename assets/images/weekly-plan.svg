<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Weekly training plan screen">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C5E3F"/>
      <stop offset="100%" stop-color="#134e35"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" rx="32" fill="#fafafa"/>
  <rect width="360" height="640" rx="32" fill="none" stroke="rgba(12,94,63,0.12)" stroke-width="2"/>
  <!-- Header -->
  <rect x="0" y="0" width="360" height="100" rx="32" fill="url(#headerGrad)"/>
  <rect x="0" y="68" width="360" height="32" fill="#134e35"/>
  <text x="32" y="48" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Plan semanal</text>
  <text x="32" y="72" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="12">Semana 12 · Objetivo HCP 15</text>
  <!-- Day cards -->
  <rect x="24" y="120" width="312" height="88" rx="16" fill="#fff" stroke="rgba(12,94,63,0.1)"/>
