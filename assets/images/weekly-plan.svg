  <rect x="24" y="528" width="312" height="80" rx="16" fill="#fff" stroke="rgba(12,94,63,0.1)"/>
  <text x="40" y="556" fill="#0d0f12" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Progreso semanal</text>
  <rect x="40" y="568" width="280" height="8" rx="4" fill="#e8f8f0"/>
  <rect x="40" y="568" width="168" height="8" rx="4" fill="#3ECF8E"/>
  <text x="320" y="596" fill="#0C5E3F" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="end">60%</text>
