<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8faf9">
  <meta name="description" content="BirdieLabs IQ · Apps para equipos. Datos y rendimiento al servicio del deporte.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://birdielabs.app/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BirdieLabs IQ">
  <meta property="og:description" content="Apps para equipos.">
  <meta property="og:url" content="https://birdielabs.app/">
  <meta property="og:site_name" content="BirdieLabs IQ">
  <title>BirdieLabs IQ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171c19;
      --green: #188653;
      --green-light: #43b77a;
      --paper: #f8faf9;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(216, 242, 226, .52) 0%, rgba(239, 248, 242, .25) 27%, transparent 58%),
        radial-gradient(ellipse at 13% 88%, rgba(228, 242, 233, .36), transparent 44%),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main {
      isolation: isolate;
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100svh;
      width: 100%;
      padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
      overflow: hidden;
    }
    main::before, main::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(1px);
    }
    main::before {
      width: min(78vw, 760px);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      background: radial-gradient(circle, rgba(225, 244, 232, .5), rgba(242, 249, 244, .18) 45%, transparent 70%);
    }
    main::after {
      width: min(42vw, 420px);
      aspect-ratio: 1;
      right: -16%;
      bottom: -34%;
      background: radial-gradient(circle, rgba(218, 239, 225, .28), transparent 68%);
    }
    .identity {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform: translateY(-1.5vh);
      animation: arrive 950ms cubic-bezier(.2,.7,.2,1) both;
    }
    .mark {
      display: block;
      width: clamp(116px, 18vw, 218px);
      height: auto;
      overflow: visible;
      margin-bottom: clamp(25px, 4.4vh, 43px);
      filter: drop-shadow(0 12px 18px rgba(24, 134, 83, .10));
    }
    h1 {
      margin: 0;
      font-size: clamp(2.45rem, 7.25vw, 5.55rem);
      font-weight: 650;
      line-height: 1.02;
      letter-spacing: -.073em;
      white-space: nowrap;
    }
    h1 span {
      color: var(--green);
      font-weight: 590;
      letter-spacing: -.075em;
    }
    .tagline {
      margin: clamp(18px, 3vh, 28px) 0 0;
      padding-left: .24em;
      color: #737c76;
      font-size: clamp(.65rem, 1.35vw, .83rem);
      font-weight: 560;
      letter-spacing: .32em;
      line-height: 1.5;
      text-transform: uppercase;
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(-1.5vh); }
    }
    @media (max-width: 520px) {
      main { padding-inline: 14px; }
      .mark { width: clamp(112px, 32vw, 154px); margin-bottom: 28px; }
      h1 { font-size: clamp(2.25rem, 10vw, 3.45rem); letter-spacing: -.075em; }
      .tagline { font-size: .64rem; letter-spacing: .25em; margin-top: 18px; }
    }
    @media (max-width: 350px) {
      h1 { font-size: 2.08rem; }
      .tagline { letter-spacing: .18em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .identity { animation: none; }
    }
  </style>
</head>
<body>
  <main aria-label="BirdieLabs IQ">
    <div class="identity">
      <svg class="mark" viewBox="0 0 240 240" role="img" aria-label="Emblema BirdieLabs IQ" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ball" x1="28" y1="24" x2="203" y2="220" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".58" stop-color="#f4faf6"/>
            <stop offset="1" stop-color="#e5f3e9"/>
          </linearGradient>
          <linearGradient id="rim" x1="43" y1="37" x2="197" y2="203" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4dbb7e"/>
            <stop offset="1" stop-color="#147b4b"/>
          </linearGradient>
          <linearGradient id="arrow" x1="81" y1="151" x2="166" y2="66" gradientUnits="userSpaceOnUse">
            <stop stop-color="#167d4c"/>
            <stop offset="1" stop-color="#42b879"/>
          </linearGradient>
          <pattern id="dimples" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="2.25" fill="#b9d9c4" opacity=".62"/>
            <circle cx="18" cy="18" r="2.25" fill="#b9d9c4" opacity=".62"/>
          </pattern>
          <clipPath id="ballClip"><circle cx="120" cy="120" r="88"/></clipPath>
        </defs>
        <circle cx="120" cy="120" r="94" fill="#dff0e5" opacity=".5"/>
        <circle cx="120" cy="120" r="88" fill="url(#ball)" stroke="url(#rim)" stroke-width="3.5"/>
        <g clip-path="url(#ballClip)">
          <rect x="31" y="31" width="178" height="178" fill="url(#dimples)" opacity=".8"/>
          <path d="M52 160 C79 178 119 182 157 162 C177 151 193 130 204 104" fill="none" stroke="#d5eadc" stroke-width="2"/>
        </g>
        <path d="M73 158 L108 123 L130 145 L177 91" fill="none" stroke="#cce7d6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
        <path d="M73 158 L108 123 L130 145 L177 91" fill="none" stroke="url(#arrow)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M148 91 H177 V120" fill="none" stroke="url(#arrow)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="73" cy="158" r="5" fill="#188653"/>
      </svg>
      <h1>BirdieLabs <span>IQ</span></h1>
      <p class="tagline">Apps para equipos</p>
    </div>
  </main>
</body>
</html>
