<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfcfb">
  <meta name="description" content="BirdieLabs IQ · Data · Performance">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://birdielabs.app/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BirdieLabs IQ">
  <meta property="og:description" content="Data · Performance">
  <meta property="og:url" content="https://birdielabs.app/">

  <title>BirdieLabs IQ</title>
  <style>
    :root { color-scheme: light; --ink:#101a1c; --green:#087744; --paper:#fbfcfb; }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; }
    body {
      min-height:100svh;
      background:
        radial-gradient(ellipse at 50% 41%, rgba(226,241,231,.52) 0%, rgba(246,249,246,.22) 30%, transparent 62%),
        linear-gradient(115deg,#fff 0%,#fbfcfb 48%,#f8faf8 100%);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    main {
      min-height:100svh; width:100%; display:grid; place-items:center;
      padding:max(36px,env(safe-area-inset-top)) 20px max(36px,env(safe-area-inset-bottom));
      overflow:hidden; isolation:isolate; position:relative;
    }
    main::before {
      content:""; position:absolute; z-index:-1; pointer-events:none;
      width:min(80vw,920px); aspect-ratio:1; left:50%; top:47%;
      transform:translate(-50%,-50%); border-radius:50%;
      background:radial-gradient(circle,rgba(235,245,238,.34) 0%,rgba(248,251,248,.16) 43%,transparent 70%);
    }
    .identity {
      width:100%; display:flex; flex-direction:column; align-items:center;
      text-align:center; transform:translateY(-1.5vh);
      animation:fade-in .8s ease-out both;
    }
    .emblem {
      display:block; width:clamp(142px,19vw,252px); height:auto;
      margin:0 0 clamp(24px,3.6vh,38px);
      overflow:visible; filter:drop-shadow(0 8px 8px rgba(0,48,26,.15));
    }
    h1 {
      margin:0; color:#11191b; font-size:clamp(3rem,6.5vw,5.8rem);
      font-weight:650; line-height:1.02; letter-spacing:-.072em; white-space:nowrap;
    }
    h1 span { color:#087744; font-weight:620; letter-spacing:-.075em; }
    .tagline {
      margin:clamp(18px,2.5vh,27px) 0 0;
      color:#747d7c; font-size:clamp(.72rem,1.25vw,.98rem);
      font-weight:500; letter-spacing:.34em; line-height:1.6;
      text-transform:uppercase; text-align:center; padding-left:.34em;
    }
    .teams { margin-top:clamp(64px,10.5vh,100px); width:min(100%, 460px); }
    .teams-heading { display:flex; align-items:center; justify-content:center; gap:24px; color:#7d8787; font-size:clamp(.62rem,1vw,.78rem); letter-spacing:.24em; white-space:nowrap; }
    .teams-heading::before,.teams-heading::after { content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,#d8dfdc); }
    .teams-heading::after { background:linear-gradient(90deg,#d8dfdc,transparent); }
    .team-placeholders { display:flex; align-items:center; justify-content:center; gap:clamp(10px,1.35vw,20px); margin-top:28px; }
    .team-placeholder { display:grid; place-items:center; width:clamp(48px,4.1vw,64px); aspect-ratio:1; border-radius:16px; background:linear-gradient(145deg,rgba(239,242,242,.9),rgba(246,248,248,.75)); }
    .team-placeholder svg { width:55%; height:55%; stroke:#8b9699; stroke-width:2.2; fill:none; }
    @keyframes fade-in { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(-1.5vh)} }
    @media(max-width:600px) {
      main { padding-inline:14px; }
      .emblem { width:clamp(130px,38vw,190px); margin-bottom:25px; }
      h1 { font-size:clamp(2.55rem,10.6vw,4rem); letter-spacing:-.075em; }
      .tagline { margin-top:17px; font-size:.68rem; letter-spacing:.24em; padding-left:.24em; }
      .teams { margin-top:clamp(52px,8vh,76px); }
      .teams-heading { gap:14px; letter-spacing:.18em; }
      .team-placeholders { gap:9px; margin-top:22px; }
      .team-placeholder { width:clamp(42px,12vw,58px); border-radius:13px; }
    }
    @media(max-width:360px) {
      h1 { font-size:2.32rem; }
      .tagline { font-size:.61rem; letter-spacing:.19em; padding-left:.19em; }
      .teams-heading { font-size:.57rem; gap:8px; letter-spacing:.12em; }
      .team-placeholders { gap:7px; }
      .team-placeholder { width:40px; border-radius:11px; }
    }
    @media(prefers-reduced-motion:reduce) { .identity{animation:none} }
  </style>
</head>
<body>

      <p class="tagline">DATA <span aria-hidden="true">·</span> PERFORMANCE <span aria-hidden="true">·</span> GOLF</p>
      <section class="teams" aria-label="Nuestros equipos">
        <div class="teams-heading">NUESTROS EQUIPOS</div>

          <div class="team-placeholder"><svg viewBox="0 0 24 24"><path d="M12 2.8c2.6 2 5.2 2.7 8 3v5.4c0 5.2-3.3 8.5-8 10.9-4.7-2.4-8-5.7-8-10.9V5.8c2.8-.3 5.4-1 8-3Z"/></svg></div>

    </div>
  </main>
